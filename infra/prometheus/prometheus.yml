global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The monitored workload. Targets live in a file so the Kubernetes override can swap them
  # (docker-compose.k8s.yml) without editing this config.
  - job_name: demo-service
    file_sd_configs:
      - files: ["/etc/prometheus/targets/demo-service.json"]
    relabel_configs:
      - target_label: service
        replacement: demo-service

  - job_name: agentops-backend
    static_configs:
      - targets: ["backend:8000"]
