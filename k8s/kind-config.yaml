kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agentops
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs: ["host.docker.internal", "localhost", "127.0.0.1"]
    extraPortMappings:
      - containerPort: 30001   # NodePort of demo-service
        hostPort: 8001         # Prometheus (compose) scrapes host.docker.internal:8001
        listenAddress: "127.0.0.1"
        protocol: TCP
