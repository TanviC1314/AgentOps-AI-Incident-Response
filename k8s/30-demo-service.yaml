apiVersion: v1
kind: Service
metadata:
  name: demo-service
  namespace: agentops-demo
  labels:
    app: demo-service
spec:
  type: NodePort
  selector:
    app: demo-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      nodePort: 30001   # mapped to host port 8001 by k8s/kind-config.yaml
