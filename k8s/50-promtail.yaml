# Log collector for the demo namespace when the workload runs in kind.
# Reads CRI log files from the node and pushes to Loki running in Docker Compose (host.docker.internal:3100).
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: agentops-demo
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://host.docker.internal:3100/loki/api/v1/push
    scrape_configs:
      - job_name: demo-pods
        static_configs:
          - targets: [localhost]
            labels:
              job: demo-pods
              __path__: /var/log/pods/agentops-demo_demo-service-*/demo-service/*.log
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                service: service
                level: level
          - labels:
              service:
              level:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: agentops-demo
spec:
  selector:
    matchLabels: {app: promtail}
  template:
    metadata:
      labels: {app: promtail}
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args: ["-config.file=/etc/promtail/promtail.yml"]
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: run, mountPath: /run/promtail}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        - name: pods
          hostPath: {path: /var/log/pods}
        - name: run
          emptyDir: {}
