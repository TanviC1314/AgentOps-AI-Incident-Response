# Override for Kubernetes mode: the demo workload runs in the kind cluster (namespace agentops-demo),
# the compose demo-service is disabled, and the backend authenticates to the cluster with the
# RESTRICTED service-account kubeconfig produced by scripts/kind-setup.ps1 (never admin credentials).
#
#   docker compose -f docker-compose.yml -f docker-compose.k8s.yml up -d --build
services:
  demo-service:
    deploy:
      replicas: 0

  backend:
    environment:
      KUBERNETES_ENABLED: "true"
      KUBECONFIG_PATH: /etc/agentops/kubeconfig
      DEMO_SERVICE_URL: http://host.docker.internal:8001
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./.kube/agentops-recovery.kubeconfig:/etc/agentops/kubeconfig:ro

  prometheus:
    volumes:
      - ./infra/prometheus/targets/demo-service.k8s.json:/etc/prometheus/targets/demo-service.json:ro
