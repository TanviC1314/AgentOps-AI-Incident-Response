# AgentOps local stack. Everything here runs without Kubernetes except real recovery actions:
#   - alerts, incidents, investigation (metrics + logs + health) work in this stack alone;
#   - restart / rollback / scale need the Kubernetes demo cluster -> see docker-compose.k8s.yml.
name: agentops

x-logging: &promtail-labels
  logging: promtail

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentops-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentops}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    labels: *promtail-labels
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentops}:${POSTGRES_PASSWORD:-agentops-local-only}@postgres:5432/${POSTGRES_DB:-agentops}
      REDIS_URL: redis://redis:6379/0
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      DEMO_SERVICE_URL: http://demo-service:8001
      DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-local-admin-token}
      KUBERNETES_ENABLED: ${KUBERNETES_ENABLED:-false}
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-agentops-demo}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  demo-service:
    build: ./demo-service
    labels: *promtail-labels
    environment:
      APP_VERSION: "1.0.0"
      ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-local-admin-token}
      SELF_TRAFFIC_RPS: "5"
    ports: ["8001:8001"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - ./infra/prometheus/targets/demo-service.json:/etc/prometheus/targets/demo-service.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on: [backend]
    ports: ["9093:9093"]

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:3.0.0
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    ports: ["3001:3000"]

volumes:
  pgdata:
  lokidata:
